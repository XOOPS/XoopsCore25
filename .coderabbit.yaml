# CodeRabbit configuration for the 2.5.11 maintenance line.
# Composer output is not reviewable code: keep it out of review content.
# (The 150-file review limit is counted before these filters apply, so a
# library update still needs its vendor commit in a PR of its own.)
reviews:
  path_filters:
    - "!htdocs/class/libraries/vendor/**"
    - "!htdocs/class/libraries/composer.dist.lock"
